apiVersion: apps/v1
kind: Deployment
metadata:
  name: registry
  labels:
    app: registry
spec:
  replicas: 1
  revisionHistoryLimit: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: registry
  template:
    metadata:
      labels:
        app: registry
    spec:
      hostNetwork: true
      containers:
      - name: registry
        image: registry:3.1.1
        env:
        - name: REGISTRY_STORAGE_DELETE_ENABLED
          value: "true"
        ports:
        - containerPort: 5000
        volumeMounts:
        - name: images
          mountPath: /var/lib/registry
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
          limits:
            cpu: "1"
            memory: 256Mi
            ephemeral-storage: 64Mi
      volumes:
      - name: images
        persistentVolumeClaim:
          claimName: registry
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: registry
spec:
  accessModes:
  - ReadWriteOnce
  storageClassName: rook-rbd
  resources:
    requests:
      storage: 20Gi
