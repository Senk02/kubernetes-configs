apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: puppy-trainer
  labels:
    external-secrets.io/type: webhook
spec:
  refreshInterval: "5m"
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-login
  target:
    creationPolicy: Owner
  data:
  - secretKey: password
    sourceRef:
      storeRef:
        name: bitwarden-login
        kind: ClusterSecretStore
    remoteRef:
      key: 55a7084b-4812-47a7-ab52-493e998888a4
      property: password
