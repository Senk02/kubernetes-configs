apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: crossplane-manage-services
  namespace: games
rules:
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: crossplane-manage-services
  namespace: games
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: crossplane-manage-services
subjects:
  - kind: ServiceAccount
    name: provider-kubernetes
    namespace: crossplane-system
