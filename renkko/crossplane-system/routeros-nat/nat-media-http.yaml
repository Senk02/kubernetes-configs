apiVersion: ip.routeros.sindrip.io/v1alpha1
kind: FirewallNAT
metadata:
  name: nat-media-http
  annotations:
    crossplane.io/external-name: "media-http"
spec:
  managementPolicies: ["Observe", "Create", "Update", "Delete"]
  deletionPolicy: Delete
  providerConfigRef:
    name: default
  forProvider:
    comment: "media-http"
    chain: dstnat
    action: dst-nat
    protocol: tcp
    dstAddressType: local
    dstAddress: "!10.1.0.0/16"
    dstPort: "80"
    toAddresses: 10.1.1.103
