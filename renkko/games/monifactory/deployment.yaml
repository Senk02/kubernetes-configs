apiVersion: apps/v1
kind: Deployment
metadata:
  name: monifactory
  labels:
    app: monifactory
spec:
  revisionHistoryLimit: 1
  replicas: 1
  selector:
    matchLabels:
      app: monifactory
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: monifactory
    spec:
      # NOTE: deliberately no priorityClassName here. The makko copy runs with
      # game-server-high-priority, which is safe on a 7-node cluster but not on a
      # single node -- a 12Gi Pending game server preempting Ceph is exactly what
      # took the mons out on makko. On renkko the same pod would be able to evict
      # rook-ceph-osd-0, i.e. all storage for both servers.
      containers:
      # Pinned, NOT :java17. The java17 tag rebuilt on 2026-08-29 ships every file
      # in /image/scripts as 0 bytes, so the entrypoint dies with
      # "exec /image/scripts/start: exec format error". 2026.8.2 (2026-08-23) is
      # the last good build -- verified 1393-byte scripts on this node's arch.
      - image: itzg/minecraft-server:2026.8.2-java17
        name: minecraft
        stdin: true
        tty: true
        env:
        - name: EULA
          value: "TRUE"
        - name: TYPE
          value: "AUTO_CURSEFORGE"
        - name: VERSION
          value: "1.20.1"
        - name: FORGE_VERSION
          value: "47.4.0"
        - name: MEMORY
          value: "6G"
        - name: CF_API_KEY
          valueFrom:
            secretKeyRef:
              name: curseforge-api-key
              key: password
        - name: CF_SLUG
          value: monifactory
        # Aikar's flags are deliberately OFF here: they set -XX:+AlwaysPreTouch,
        # which commits the whole heap at JVM start instead of growing into it.
        # At 10G that took the node down 103 s in, next to cobbleverse's 8G.
        - name: USE_AIKAR_FLAGS
          value: "false"
        - name: TZ
          value: "America/Chicago"
        volumeMounts:
        - name: data
          mountPath: /data
        ports:
        - containerPort: 25565
          protocol: TCP
        resources:
          # Heap is 6G (MEMORY above), so 8Gi leaves ~2Gi for metaspace/GC/netty.
          # Sized to coexist with cobbleverse (11Gi limit) and rook-ceph on a
          # single 30.4Gi node; makko's 16Gi limit is far too large to share.
          limits:
            cpu: "4"
            memory: 8Gi
          requests:
            cpu: 100m
            memory: 7Gi
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: minecraft-monifactory
          readOnly: false

---
kind: PersistentVolumeClaim
apiVersion: v1
metadata:
  name: minecraft-monifactory
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 30Gi
  storageClassName: rook-rbd
  volumeMode: Filesystem
