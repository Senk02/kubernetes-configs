apiVersion: apps/v1
kind: Deployment
metadata:
  name: monifactory
  labels:
    app: monifactory
spec:
  revisionHistoryLimit: 1
  replicas: 0
  selector:
    matchLabels:
      app: monifactory
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: monifactory
    spec:
      # NOTE: deliberately no priorityClassName here. The makko copy runs with
      # game-server-high-priority, which is safe on a 7-node cluster but not on a
      # single node -- a 12Gi Pending game server preempting Ceph is exactly what
      # took the mons out on makko. On renkko the same pod would be able to evict
      # rook-ceph-osd-0, i.e. all storage for both servers.
      containers:
      # GraalVM, pinned -- two separate arm64 problems forced this on renkko:
      #  1. the floating :java17 tag rebuilt 2026-08-29 ships every file in
      #     /image/scripts as 0 bytes ("exec .../start: exec format error").
      #  2. the JRE in ALL :java17 builds SIGBUSes on this CPU -- plain
      #     `java -version` dies with "Bus error" on 2026.7.2, 2026.8.1, 2026.8.2
      #     and stable-java17 alike, which is also why mc-image-helper crashed.
      # Oracle GraalVM 17.0.16 and Temurin 17 both run fine here; :java17-jdk
      # (Temurin) has not been rebuilt since 2024-07, so GraalVM is the current
      # one. Verified on-node: 1393-byte scripts, mc-image-helper 1.66.1, java ok.
      # Forge 1.20.1 needs Java 17, so :java21 (what cobbleverse uses) is not an
      # option here.
      - image: itzg/minecraft-server:2026.8.2-java17-graalvm
        name: minecraft
        stdin: true
        tty: true
        env:
        - name: EULA
          value: "TRUE"
        - name: TYPE
          value: "AUTO_CURSEFORGE"
        - name: VERSION
          value: "1.20.1"
        - name: FORGE_VERSION
          value: "47.4.0"
        - name: MEMORY
          value: "6G"
        - name: CF_API_KEY
          valueFrom:
            secretKeyRef:
              name: curseforge-api-key
              key: password
        - name: CF_SLUG
          value: monifactory
        # Aikar's flags are deliberately OFF here: they set -XX:+AlwaysPreTouch,
        # which commits the whole heap at JVM start instead of growing into it.
        # At 10G that took the node down 103 s in, next to cobbleverse's 8G.
        - name: USE_AIKAR_FLAGS
          value: "false"
        - name: TZ
          value: "America/Chicago"
        volumeMounts:
        - name: data
          mountPath: /data
        ports:
        - containerPort: 25565
          protocol: TCP
        resources:
          # Heap is 6G (MEMORY above), so 8Gi leaves ~2Gi for metaspace/GC/netty.
          # Sized to coexist with cobbleverse (11Gi limit) and rook-ceph on a
          # single 30.4Gi node; makko's 16Gi limit is far too large to share.
          limits:
            cpu: "4"
            memory: 8Gi
          requests:
            cpu: 100m
            memory: 7Gi
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: minecraft-monifactory
          readOnly: false

---
kind: PersistentVolumeClaim
apiVersion: v1
metadata:
  name: minecraft-monifactory
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 30Gi
  storageClassName: rook-rbd
  volumeMode: Filesystem
