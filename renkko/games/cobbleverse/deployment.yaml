apiVersion: apps/v1
kind: Deployment
metadata:
  name: cobbleverse
  labels:
    app: cobbleverse
spec:
  revisionHistoryLimit: 1
  replicas: 1
  selector:
    matchLabels:
      app: cobbleverse
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: cobbleverse
    spec:
      containers:
      - image: itzg/minecraft-server:java21
        name: minecraft
        stdin: true
        tty: true
        env:
        - name: EULA
          value: "TRUE"
        - name: SKIP_SERVER_PROPERTIES
          value: "true"
        - name: TYPE
          value: "MODRINTH"
        - name: MODRINTH_MODPACK
          value: cobbleverse
        - name: MODRINTH_LOADER
          value: fabric
        - name: VERSION
          value: "1.21.1"
        - name: MODRINTH_VERSION
          value: "1.7.42"
        # polylib is a hard dependency of ftbbackups2 (requires >= 2100.0.3-build.153);
        # the cobbleverse pack does not ship it, so the server fails to start without it.
        - name: MODRINTH_PROJECTS
          value: "configurable:3.5.2,cobblemon-exp.-all:0.0.2,polylib:2100.0.3-build.160"
        # FTB Backups 2 is CurseForge-only (not published to Modrinth), so it is
        # pulled by direct CDN URL rather than via MODRINTH_PROJECTS. 1.0.28 is the
        # newest build that targets 1.21.1 (1.0.29+ jumped to 1.21.3/1.21.4/1.21.5).
        - name: MODS
          value: "https://mediafilez.forgecdn.net/files/5501/350/ftbbackups2-fabric-1.21-1.0.28.jar"
        - name: MODRINTH_EXCLUDE_FILES
          value: "c2me"
        - name: MODRINTH_FORCE_SYNCHRONIZE
          value: "true"
        - name: MEMORY
          value: "8G"
        - name: USE_AIKAR_FLAGS
          value: "true"
        - name: TZ
          value: "America/Chicago"
        volumeMounts:
        - name: data
          mountPath: /data
        # FTB Backups 2 defaults to backup_location "." which resolves to
        # <serverdir>/backups. Mounting the 120Gi backups PVC there keeps backups off
        # the 25Gi world volume without needing a config file. subPath isolates them
        # from the mc-backup sidecar's old world-*.tar.gz at the PVC root.
        - name: backups
          mountPath: /data/backups
          subPath: ftb
        - name: server-properties
          mountPath: /data/server.properties
          subPath: server.properties
        ports:
        - containerPort: 25565
          protocol: TCP
        startupProbe:
          exec:
            command: ["mc-health"]
          initialDelaySeconds: 120
          periodSeconds: 15
          failureThreshold: 120
        readinessProbe:
          exec:
            command: ["mc-health"]
          periodSeconds: 30
          failureThreshold: 3
        resources:
          limits:
            cpu: "8"
            memory: 11Gi
          requests:
            cpu: 500m
            memory: 9Gi
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: minecraft-cobbleverse
          readOnly: false
      - name: backups
        persistentVolumeClaim:
          claimName: cobbleverse-backups
      - name: server-properties
        secret:
          secretName: cobbleverse-server-properties

---
kind: PersistentVolumeClaim
apiVersion: v1
metadata:
  name: minecraft-cobbleverse
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 25Gi
  storageClassName: rook-rbd
  volumeMode: Filesystem

---
kind: PersistentVolumeClaim
apiVersion: v1
metadata:
  name: cobbleverse-backups
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 120Gi
  storageClassName: rook-rbd
  volumeMode: Filesystem
