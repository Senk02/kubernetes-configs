apiVersion: apps/v1
kind: Deployment
metadata:
  name: cobbleverse
  labels:
    app: cobbleverse
spec:
  revisionHistoryLimit: 1
  replicas: 1
  selector:
    matchLabels:
      app: cobbleverse
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: cobbleverse
    spec:
      containers:
      - image: itzg/minecraft-server:java21
        name: minecraft
        stdin: true
        tty: true
        env:
        - name: EULA
          value: "TRUE"
        - name: SKIP_SERVER_PROPERTIES
          value: "true"
        - name: TYPE
          value: "MODRINTH"
        - name: MODRINTH_MODPACK
          value: cobbleverse
        - name: MODRINTH_LOADER
          value: fabric
        - name: VERSION
          value: "1.21.1"
        - name: MODRINTH_VERSION
          value: "1.7.42"
        # advanced-backups replaces ftbbackups2, which is inert on this pack: LibJF's
        # ASM transformer cannot process ftbbackups2's repacked Quartz scheduler
        # ("JSR/RET are not supported with computeFrames option"), so its init throws
        # and it registers no commands. polylib went with it -- it existed only as an
        # ftbbackups2 dependency. cobblemon-saveguard guards against the Cobblemon
        # store corruption that a power loss causes (zeroes both the live file and .old).
        - name: MODRINTH_PROJECTS
          value: "configurable:3.5.2,cobblemon-exp.-all:0.0.2,advanced-backups:3.7.1,cobblemon-saveguard:1.0.0-mc1.21.1-eng"
        - name: MODRINTH_EXCLUDE_FILES
          value: "c2me"
        - name: MODRINTH_FORCE_SYNCHRONIZE
          value: "true"
        - name: MEMORY
          value: "8G"
        - name: USE_AIKAR_FLAGS
          value: "true"
        - name: TZ
          value: "America/Chicago"
        volumeMounts:
        - name: data
          mountPath: /data
        # Backup mods default to writing <serverdir>/backups. Mounting the 120Gi backups
        # PVC there keeps backups off the 25Gi world volume. subPath isolates them from
        # the retired mc-backup sidecar's world-*.tar.gz at the PVC root.
        - name: backups
          mountPath: /data/backups
          subPath: ftb
        - name: server-properties
          mountPath: /data/server.properties
          subPath: server.properties
        ports:
        - containerPort: 25565
          protocol: TCP
        startupProbe:
          exec:
            command: ["mc-health"]
          initialDelaySeconds: 120
          periodSeconds: 15
          failureThreshold: 120
        readinessProbe:
          exec:
            command: ["mc-health"]
          periodSeconds: 30
          failureThreshold: 3
        resources:
          limits:
            cpu: "8"
            memory: 11Gi
          requests:
            cpu: 500m
            memory: 9Gi
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: minecraft-cobbleverse
          readOnly: false
      - name: backups
        persistentVolumeClaim:
          claimName: cobbleverse-backups
      - name: server-properties
        secret:
          secretName: cobbleverse-server-properties

---
kind: PersistentVolumeClaim
apiVersion: v1
metadata:
  name: minecraft-cobbleverse
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 25Gi
  storageClassName: rook-rbd
  volumeMode: Filesystem

---
kind: PersistentVolumeClaim
apiVersion: v1
metadata:
  name: cobbleverse-backups
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 120Gi
  storageClassName: rook-rbd
  volumeMode: Filesystem
