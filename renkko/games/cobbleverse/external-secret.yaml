apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cobbleverse-server-properties
spec:
  refreshInterval: "5m"
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-login
  target:
    name: cobbleverse-server-properties
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        rconPassword: "{{ .rconPassword }}"
        server.properties: |
          accepts-transfers=false
          allow-flight=false
          allow-nether=true
          broadcast-console-to-ops=true
          broadcast-rcon-to-ops=false
          bug-report-link=
          difficulty=easy
          enable-command-block=false
          enable-jmx-monitoring=false
          enable-query=false
          enable-rcon=true
          enable-status=true
          enforce-secure-profile=true
          enforce-whitelist=false
          entity-broadcast-range-percentage=100
          force-gamemode=false
          function-permission-level=2
          gamemode=survival
          generate-structures=true
          generator-settings={}
          hardcore=false
          hide-online-players=false
          initial-disabled-packs=
          initial-enabled-packs=vanilla,fabric,accessories,balm,beautify,carved_wood,cobblecuisine,cobbledollars,cobblefurnies,cobblemon,cobblemon-additions,cobblemonbattlepositions,cobblemonraiddens,cobblenav,cobbleversebadges,cobbreeding,comforts,cozyhome,fabric-convention-tags-v2,fightorflight,handcrafted,legendarymonuments,lenientdeath,libjf-data-v0,lumymon,mega_showdown,moarconcrete,neruina,obc,particular,pokeblocks,porting_lib_item_abilities,rctmod,rechiseled,repurposed_structures,server_translations_api,sophisticatedbackpacks,sophisticatedcore,sophisticatedstorage,supermartijn642corelib,tim_core,tmcraft,toms_storage,trinkets,vanillabackport,waystones,zamega,lumymon\:compat,cobblemon\:repurposedstructurescobblemon,carved_wood\:carvedwood_vanillabackport_compat
          level-name=world
          level-seed=
          level-type=minecraft\:normal
          log-ips=true
          max-chained-neighbor-updates=1000000
          max-players=20
          max-tick-time=-1
          max-world-size=29999984
          motd=Cobbleverse on renkko
          network-compression-threshold=256
          online-mode=true
          op-permission-level=4
          player-idle-timeout=0
          prevent-proxy-connections=false
          pvp=true
          query.port=25565
          rate-limit=0
          rcon.password={{ .rconPassword }}
          rcon.port=25575
          region-file-compression=deflate
          require-resource-pack=false
          resource-pack-id=
          resource-pack-prompt=
          resource-pack-sha1=
          resource-pack=
          server-ip=
          server-port=25565
          simulation-distance=6
          spawn-animals=true
          spawn-monsters=true
          spawn-npcs=true
          spawn-protection=16
          sync-chunk-writes=true
          text-filtering-config=
          use-native-transport=true
          view-distance=8
          white-list=false
  data:
    - secretKey: rconPassword
      sourceRef:
        storeRef:
          name: bitwarden-login
          kind: ClusterSecretStore
      remoteRef:
        key: 73396fcc-ae97-4af1-9846-d961fcc249ea
        property: password
