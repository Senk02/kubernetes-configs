---
clusterName: renkko
talosVersion: v1.12.6
kubernetesVersion: v1.32.3
endpoint: https://10.1.0.230:6443
allowSchedulingOnControlPlanes: true

cniConfig:
  name: none

clusterPodNets:
  - 10.244.0.0/16
clusterSvcNets:
  - 10.96.0.0/12

nodes:
  - hostname: renkko-owner1
    ipAddress: 10.1.0.230
    controlPlane: true
    installDisk: /dev/nvme0n1
    schematic:
      customization:
        extraKernelArgs:
          - pcie_aspm=off
          # Disables CONFIG_PAGE_TABLE_CHECK, a hardening check that validates
          # page-table entries on every page alloc/free. On this board it is the
          # direct cause of the recurring hard resets: page_ext_lookup() returns
          # NULL and __page_table_check_zero() dereferences it, panicking in
          # post_alloc_hook <- folio_alloc <- iomap_file_buffered_write, i.e. on
          # ANY buffered block-device write. bluefs_buffered_io=false (2026-08-22)
          # only removed Ceph as a writer and bought 184 h; monifactory unpacking
          # a modpack onto ext4-on-RBD reproduced it in 11 min. The check is not
          # required for correct operation, so turning it off removes the bug
          # rather than damping one trigger. See renkko-hardware-instability.
          - page_table_check=off
        systemExtensions:
          officialExtensions:
            - siderolabs/iscsi-tools
            - siderolabs/util-linux-tools
    networkInterfaces:
      - interface: enp1s0
        addresses:
          - 10.1.0.230/16
        routes:
          - network: 0.0.0.0/0
            gateway: 10.1.0.1

patches:
  - |-
    machine:
      kubelet:
        extraArgs:
          allowed-unsafe-sysctls: net.ipv4.conf.all.src_valid_mark,net.ipv4.ip_forward
        extraMounts:
          - destination: /var/mnt
            type: bind
            source: /var/mnt
            options:
              - bind
              - rshared
              - rw
          - destination: /var/lib/rook
            type: bind
            source: /var/lib/rook
            options:
              - bind
              - rshared
              - rw
        defaultRuntimeSeccompProfileEnabled: true
        disableManifestsDirectory: true
      kernel:
        modules:
          - name: rbd
          - name: ceph
      features:
        kubePrism:
          enabled: true
          port: 7445
        hostDNS:
          enabled: true
          forwardKubeDNSToHost: true
  - |-
    cluster:
      proxy:
        disabled: true
      discovery:
        enabled: true
        registries:
          kubernetes:
            disabled: true
          service: {}
