apiVersion: ceph.rook.io/v1
kind: CephCluster
metadata:
  name: rook-ceph
  namespace: rook-ceph
spec:
  cephVersion:
    image: quay.io/ceph/ceph:v19.2.3
  dataDirHostPath: /var/lib/rook
  mgr:
    count: 2
    allowMultiplePerNode: true
    modules:
      - name: rook
        enabled: true
  mon:
    count: 3
    # MUST stay false. With `true`, Rook happily stacked all three mons onto
    # talos-yha-nr5 (verified 2026-09-01 via the rook-ceph-mon-endpoints
    # mapping: a/f/h all -> 10.0.0.40), which makes losing that one node a
    # total cluster outage -- no quorum, every RBD/CephFS mount hangs. That
    # node is also the smallest (/var/lib/rook is 135G vs 476G/465G) and has
    # filled up before.
    #
    # Only 3 nodes can hold a mon at all: the other three are control-plane
    # with a NoSchedule taint, and talos-e6m-uzm is unreachable. So this is
    # exactly one mon per schedulable node with no slack -- if a worker dies,
    # Rook cannot build a replacement mon, but quorum still survives 2/3,
    # which is the part that matters.
    allowMultiplePerNode: false
  dashboard:
    enabled: true
    ssl: false
  removeOSDsIfOutAndSafeToRemove: true
  priorityClassNames:
    osd: storage-critical
    # mon had NO priority class, while a game server sat at
    # game-server-high-priority (1000). That inversion already cost this
    # cluster its quorum once: a 12Gi Pending game server held the
    # reservation and the mons could not schedule. Storage must outrank
    # anything it is storage *for*.
    mon: storage-critical
    mgr: storage-critical
  storage:
    useAllNodes: false
    useAllDevices: false
    nodes:
    - name: "talos-bm5-aks"
      devices:
      - name: "/dev/disk/by-id/ata-TEAM_T2531TB_TPBF2312040090101521"
      - name: "/dev/disk/by-id/ata-TEAM_T2531TB_TPBF2309110030301830"
      - name: "/dev/disk/by-id/ata-ST4000NM010A-2HZ111_WJG0PHK0"
      resources:
        requests:
          cpu: 100m
          memory: 2Gi
    - name: "talos-e6m-uzm"
      devices:
      - name: "/dev/disk/by-id/ata-OOS14000G_0000CGZ0"
      resources:
        requests:
          cpu: 100m
          memory: 2Gi
    - name: "talos-73x-rd9"
      devices:
      - name: "/dev/disk/by-id/ata-ST4000NM010A-2HZ111_WJG0M3DJ"
      - name: "/dev/disk/by-id/ata-ST4000NM010A-2HZ111_WS22BE9S"
      - name: "/dev/disk/by-id/nvme-SPCC_M.2_PCIe_SSD_PA9012R001145"
      resources:
        requests:
          cpu: 100m
          memory: 2Gi
    - name: "talos-yha-nr5"
      devices:
      - name: "/dev/disk/by-id/scsi-0QEMU_QEMU_HARDDISK_drive-scsi2"
      - name: "/dev/disk/by-id/scsi-0QEMU_QEMU_HARDDISK_drive-scsi3"
      - name: "/dev/disk/by-id/scsi-0QEMU_QEMU_HARDDISK_drive-scsi4"
      resources:
        requests:
          cpu: 100m
          memory: 2Gi
  resources:
    crashcollector:
      requests:
        cpu: 100m
        memory: 16Mi
    mgr:
      requests:
        cpu: 100m
        memory: 512Mi
    mon:
      requests:
        cpu: 50m
        memory: 512Mi
    exporter:
      requests:
        cpu: 5m
        memory: 20Mi
    csi-rbdplugin-provisioner:
      requests:
        cpu: 10m
        memory: 256Mi
    csi-cephfsplugin:
      requests:
        cpu: 10m
        memory: 64Mi