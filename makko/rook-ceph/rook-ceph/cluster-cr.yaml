apiVersion: ceph.rook.io/v1
kind: CephCluster
metadata:
  name: rook-ceph
  namespace: rook-ceph
spec:
  cephVersion:
    image: quay.io/ceph/ceph:v19.2.3
  dataDirHostPath: /var/lib/rook
  mgr:
    count: 2
    allowMultiplePerNode: true
    modules:
      - name: rook
        enabled: true
  mon:
    count: 3
    # Keep false. With `true` Rook had stacked all three mons onto
    # talos-yha-nr5, which made losing that one node a total cluster outage --
    # no quorum, every RBD/CephFS mount hangs. It is also the smallest node
    # (/var/lib/rook 135G vs 476G on 73x-rd9 and 465G on bm5-aks) and has
    # filled up before. As of 2026-09-02 they are spread one per node:
    # a -> talos-yha-nr5, f -> talos-bm5-aks, h -> talos-73x-rd9.
    #
    # ⚠ This flag does NOT relocate anything. It only adds required pod
    # anti-affinity, which prevents future re-stacking. Actual placement lives
    # in the `mapping` key of the rook-ceph-mon-endpoints configmap (NOT in
    # git), and Rook preserves an existing mon's node assignment -- it derives
    # each mon deployment's `nodeSelector: kubernetes.io/hostname` from it.
    #
    # To move a mon: patch ONLY that `mapping` key, then restart the operator
    # so it reloads (it caches the mapping and rewrites the configmap on every
    # reconcile, so editing without a restart gets overwritten). Rook then
    # rolls the mon to the new node by itself. Safe because each mon has its
    # own Service ClusterIP, so its monmap address survives the move, and
    # because CSI clients read the separate `data` key -- never touch that or
    # `csi-cluster-config-json`. The moved mon starts with an empty
    # /var/lib/rook/mon-<id> and re-syncs from quorum.
    #
    # ⚠ Do this only with all 3 mons UP. If fewer than 3 mon deployments
    # exist, the quorum threshold of 2 makes ceph answer every ok-to-stop
    # check with EBUSY ("not enough monitors would be available"), and Rook
    # updates existing mons BEFORE creating missing ones -- so it never
    # recreates the third and the rollout deadlocks. Never delete a mon
    # deployment expecting auto-failover: the mon health checker only runs
    # after a SUCCESSFUL reconcile, and reconciles currently never finish
    # (the operator loops forever on "OSD n is not ok-to-stop" because
    # awafs's 20 inactive PGs make ok-to-stop unsatisfiable).
    #
    # Only 3 nodes can hold a mon: the other three are control-plane with a
    # NoSchedule taint and talos-e6m-uzm is unreachable. So this is one mon per
    # schedulable node with no slack -- if a worker dies Rook cannot build a
    # replacement mon, but quorum still survives 2/3, which is the part that
    # matters.
    allowMultiplePerNode: false
  dashboard:
    enabled: true
    ssl: false
  removeOSDsIfOutAndSafeToRemove: true
  priorityClassNames:
    osd: storage-critical
    # mon had NO priority class, while a game server sat at
    # game-server-high-priority (1000). That inversion already cost this
    # cluster its quorum once: a 12Gi Pending game server held the
    # reservation and the mons could not schedule. Storage must outrank
    # anything it is storage *for*.
    mon: storage-critical
    mgr: storage-critical
  storage:
    useAllNodes: false
    useAllDevices: false
    nodes:
    - name: "talos-bm5-aks"
      devices:
      - name: "/dev/disk/by-id/ata-TEAM_T2531TB_TPBF2312040090101521"
      - name: "/dev/disk/by-id/ata-TEAM_T2531TB_TPBF2309110030301830"
      - name: "/dev/disk/by-id/ata-ST4000NM010A-2HZ111_WJG0PHK0"
      resources:
        requests:
          cpu: 100m
          memory: 2Gi
    - name: "talos-e6m-uzm"
      devices:
      - name: "/dev/disk/by-id/ata-OOS14000G_0000CGZ0"
      resources:
        requests:
          cpu: 100m
          memory: 2Gi
    - name: "talos-73x-rd9"
      devices:
      - name: "/dev/disk/by-id/ata-ST4000NM010A-2HZ111_WJG0M3DJ"
      - name: "/dev/disk/by-id/ata-ST4000NM010A-2HZ111_WS22BE9S"
      - name: "/dev/disk/by-id/nvme-SPCC_M.2_PCIe_SSD_PA9012R001145"
      resources:
        requests:
          cpu: 100m
          memory: 2Gi
    - name: "talos-yha-nr5"
      devices:
      - name: "/dev/disk/by-id/scsi-0QEMU_QEMU_HARDDISK_drive-scsi2"
      - name: "/dev/disk/by-id/scsi-0QEMU_QEMU_HARDDISK_drive-scsi3"
      - name: "/dev/disk/by-id/scsi-0QEMU_QEMU_HARDDISK_drive-scsi4"
      resources:
        requests:
          cpu: 100m
          memory: 2Gi
  resources:
    crashcollector:
      requests:
        cpu: 100m
        memory: 16Mi
    mgr:
      requests:
        cpu: 100m
        memory: 512Mi
    mon:
      requests:
        cpu: 50m
        memory: 512Mi
    exporter:
      requests:
        cpu: 5m
        memory: 20Mi
    csi-rbdplugin-provisioner:
      requests:
        cpu: 10m
        memory: 256Mi
    csi-cephfsplugin:
      requests:
        cpu: 10m
        memory: 64Mi